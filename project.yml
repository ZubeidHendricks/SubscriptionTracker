# Generated by AppFactoryKit appgen. Run: xcodegen generate
name: SubscriptionTracker
options:
  bundleIdPrefix: com.zubeid
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  AppFactoryKit:
    url: https://github.com/ZubeidHendricks/AppFactoryKit
    from: "0.1.0"

targets:
  SubscriptionTracker:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
    dependencies:
      - package: AppFactoryKit
        product: AppFactoryKit
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: "Subscription Tracker"
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_NAME: SubscriptionTracker
        PRODUCT_BUNDLE_IDENTIFIER: com.zubeid.subscriptiontracker
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  SubscriptionTrackerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
      - path: Sources/SubscriptionStore.swift
    settings:
      base:
        PRODUCT_NAME: SubscriptionTrackerTests
        PRODUCT_BUNDLE_IDENTIFIER: com.zubeid.subscriptiontracker.tests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"

schemes:
  Tests:
    build:
      targets:
        SubscriptionTrackerTests: [test]
    test:
      targets:
        - SubscriptionTrackerTests
